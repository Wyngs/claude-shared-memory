name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coordinator
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: coordinator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coordinator"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://coordinator:test-only@localhost:5432/coordinator?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o coordinator ./cmd/coordinator
      - run: node --test mcp/server.test.mjs
        env:
          COORDINATOR_BINARY: ./coordinator
