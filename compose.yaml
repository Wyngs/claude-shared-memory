services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: coordinator
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator"]
      interval: 3s
      timeout: 3s
      retries: 20
  coordinator:
    build: .
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      DATABASE_URL: postgres://coordinator:${POSTGRES_PASSWORD}@postgres:5432/coordinator?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
